[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "compaction-check"
version = "0.2.0a1"
description = "Check whether agent constraints survive context compaction, using Jev."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pratik Mahalle"}]
keywords = ["agents", "compaction", "constraints", "evaluations", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/pratik-mahalle/compaction-check"
Documentation = "https://github.com/pratik-mahalle/compaction-check#readme"
Issues = "https://github.com/pratik-mahalle/compaction-check/issues"
Changelog = "https://github.com/pratik-mahalle/compaction-check/blob/main/CHANGELOG.md"

[project.scripts]
compaction-check = "compaction_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
