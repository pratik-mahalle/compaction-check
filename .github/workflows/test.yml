name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: compaction-check trace examples/traces/good.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.9 build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build --outdir release-dist
      - run: python -m twine check release-dist/*
      - name: Validate artifacts and versions
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/release_artifacts.py --tag "v$VERSION" --directory release-dist
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/compaction-check-smoke
          /tmp/compaction-check-smoke/bin/python -m pip install --no-deps release-dist/*.whl
          /tmp/compaction-check-smoke/bin/compaction-check --version
          /tmp/compaction-check-smoke/bin/python -m unittest discover -s tests -v
